[package]
name = "sarae-agent-desktop"
version = "0.2.0"
description = "Sarae Windows Agent desktop shell (Tauri) hosting the Python Agent Core sidecar"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sarae_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
